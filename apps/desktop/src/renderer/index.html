<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyGuard Desktop Control Bridge</title>
    <style>
      body {
        margin: 0;
        background-color: #0B0F17;
        color: #F9FAFB;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
      }
      .loader {
        border: 3px solid #1F2937;
        border-top: 3px solid #10B981;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h2 {
        margin-top: 16px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        color: #9CA3AF;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <h2>Connecting to SkyGuard Mission Stream...</h2>
    <p>Loading local SQLite telemetry database and secure IPC bridge</p>
  </body>
</html>
